app:
  title: Easy Export
  port: 8000
  host: localhost
  description: Easy Export
  version: 1.0.0
  contact:
    email: changyunjeff@outlook.com
    name: Chang Yun jeff

logging:
  level: INFO    # INFO, WARNING, ERROR, CRITICAL
  console_enabled: false
  log_path: "logs/prod.log"
  access_log_path: "logs/access.log"
  error_log_path: "logs/error.log"

redis:
  enabled: true
  host: localhost
  port: 6379
  db: 0
  password: null  # 生产环境建议设置密码
  decode_responses: true
  max_connections: 100
  socket_connect_timeout: 5
  socket_timeout: 5

api:
  prefix: "/api/v1"
  cors:
    enabled: true
    allow_origins:
      - "https://yourdomain.com"  # 生产环境请修改为实际域名
    allow_headers:
      - "Content-Type"
      - "Authorization"
    allow_credentials: true
    expose_headers: []
    max_age: 7200

rate_limit:
  enabled: true
  requests_per_minute: 600
  requests_per_hour: 10000
  requests_per_day: 100000
  burst_size: 10
  key_prefix: "rate_limit"

ddos_protection:
  enabled: true
  max_requests_per_second: 50
  max_requests_per_minute: 1000
  block_duration: 3600
  whitelist_ips: []
  blacklist_ips: []
  key_prefix: "ddos_protection"
  enable_auto_blacklist: true

rocketmq:
  enabled: true
  name_server: "localhost:9876"
  producer_group: "export_producer_group"
  consumer_group: "export_consumer_group"
  topic: "export_tasks"
  tag: "*"
  max_message_size: 4194304
  send_timeout: 3000
  retry_times: 3
  consumer_thread_min: 2
  consumer_thread_max: 10
  consume_message_batch_max_size: 1
  pull_batch_size: 32
  pull_interval: 0
  consume_timeout: 15
  max_reconsume_times: 16
  suspend_current_queue_time: 1000
  access_key: null
  secret_key: null
  security_token: null
  namespace: null

ssl:
  enabled: false                        # ⚠️ 生产环境强烈建议启用HTTPS
  certfile: "certs/prod-cert.pem"       # SSL证书文件路径（使用真实证书）
  keyfile: "certs/prod-key.pem"         # SSL私钥文件路径
  ca_certs: null                        # CA证书链文件路径（可选）
  cert_reqs: 0                          # 证书要求：0=不要求，1=可选，2=必需
  ssl_version: null                     # SSL协议版本（null=使用TLS 1.2+）
  ciphers: null                         # 加密套件（null=使用安全默认值）